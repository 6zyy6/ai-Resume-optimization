{
  "apiVersion": "cloudbase.tencent.com/v1",
  "kind": "CloudRunService",
  "metadata": {"name": "resume-api"},
  "spec": {
    "image": "${REGISTRY}/resume-api:${COMMIT_SHA}",
    "replicas": {"min": 2, "max": 10},
    "network": {"ingress": "public", "egress": "vpc"},
    "ports": [{"containerPort": 8000}],
    "envFromSecrets": ["DATABASE_URL", "CELERY_BROKER_URL", "AI_SERVICE_TOKEN", "STORAGE_SIGNING_SECRET", "COS_SECRET_ID", "COS_SECRET_KEY"],
    "env": {"AI_INTERNAL_URL": "http://resume-ai.internal:3101", "APP_COMMIT_SHA": "${COMMIT_SHA}", "COST_WARN_PERCENT": "70", "COST_DEGRADE_PERCENT": "90", "COST_STOP_PERCENT": "100"},
    "health": {"live": "/v1/health/live", "ready": "/v1/health/ready", "version": "/v1/version"},
    "rollout": {"strategy": "canary", "canaryPercent": 10, "observationMinutes": 30}
  }
}
