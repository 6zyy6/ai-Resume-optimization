{
  "name": "ai-resume",
  "services": {
    "postgres": {
      "image": "postgres:18-alpine",
      "environment": {
        "POSTGRES_DB": "${POSTGRES_DB:-ai_resume}",
        "POSTGRES_USER": "${POSTGRES_USER:-ai_resume}",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      },
      "networks": ["data"],
      "volumes": ["postgres-data:/var/lib/postgresql/data"],
      "healthcheck": {"test": ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_resume} -d ${POSTGRES_DB:-ai_resume}"], "interval": "10s", "timeout": "5s", "retries": 5}
    },
    "redis": {
      "image": "redis:8-alpine",
      "command": ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"],
      "networks": ["data"],
      "volumes": ["redis-data:/data"],
      "healthcheck": {"test": ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], "interval": "10s", "timeout": "5s", "retries": 5}
    },
    "api": {
      "build": {"context": "../..", "dockerfile": "infra/docker/api.Dockerfile"},
      "environment": {
        "DATABASE_URL": "${DATABASE_URL:?set DATABASE_URL}",
        "CELERY_BROKER_URL": "${CELERY_BROKER_URL:?set CELERY_BROKER_URL}",
        "AI_INTERNAL_URL": "http://ai:3101",
        "AI_SERVICE_TOKEN": "${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}",
        "APP_COMMIT_SHA": "${COMMIT_SHA:-local}"
      },
      "ports": ["127.0.0.1:8000:8000"],
      "networks": ["edge", "data", "internal"],
      "depends_on": {"postgres": {"condition": "service_healthy"}, "redis": {"condition": "service_healthy"}, "ai": {"condition": "service_healthy"}},
      "healthcheck": {"test": ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready')"], "interval": "10s", "timeout": "5s", "retries": 5}
    },
    "dispatcher": {
      "build": {"context": "../..", "dockerfile": "infra/docker/api.Dockerfile"},
      "command": ["python", "-m", "app.workers.dispatcher"],
      "environment": {"DATABASE_URL": "${DATABASE_URL:?set DATABASE_URL}", "CELERY_BROKER_URL": "${CELERY_BROKER_URL:?set CELERY_BROKER_URL}"},
      "networks": ["data", "internal"],
      "depends_on": {"postgres": {"condition": "service_healthy"}, "redis": {"condition": "service_healthy"}}
    },
    "worker-ai": {
      "build": {"context": "../..", "dockerfile": "infra/docker/api.Dockerfile"},
      "command": ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "ai.interactive,ai.batch", "--concurrency=10", "--max-tasks-per-child=100", "--loglevel=INFO"],
      "stop_grace_period": "45s",
      "environment": {"DATABASE_URL": "${DATABASE_URL:?set DATABASE_URL}", "CELERY_BROKER_URL": "${CELERY_BROKER_URL:?set CELERY_BROKER_URL}", "AI_INTERNAL_URL": "http://ai:3101", "AI_SERVICE_TOKEN": "${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}"},
      "networks": ["data", "internal"]
    },
    "worker-file": {
      "build": {"context": "../..", "dockerfile": "infra/docker/api.Dockerfile"},
      "command": ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "file.parse,file.export", "--concurrency=5", "--max-tasks-per-child=100", "--loglevel=INFO"],
      "stop_grace_period": "45s",
      "environment": {"DATABASE_URL": "${DATABASE_URL:?set DATABASE_URL}", "CELERY_BROKER_URL": "${CELERY_BROKER_URL:?set CELERY_BROKER_URL}"},
      "networks": ["data", "internal"]
    },
    "worker-privacy": {
      "build": {"context": "../..", "dockerfile": "infra/docker/api.Dockerfile"},
      "command": ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "privacy", "--concurrency=2", "--loglevel=INFO"],
      "stop_grace_period": "45s",
      "environment": {"DATABASE_URL": "${DATABASE_URL:?set DATABASE_URL}", "CELERY_BROKER_URL": "${CELERY_BROKER_URL:?set CELERY_BROKER_URL}"},
      "networks": ["data", "internal"]
    },
    "ai": {
      "build": {"context": "../..", "dockerfile": "infra/docker/ai.Dockerfile"},
      "environment": {"AI_HOST": "0.0.0.0", "AI_PORT": "3101", "AI_RUNTIME_MODE": "${AI_RUNTIME_MODE:-fixture}", "AI_SERVICE_TOKEN": "${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN}", "AI_REDIS_URL": "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1", "AI_TEXT_PROVIDER": "${AI_TEXT_PROVIDER:-deepseek}", "AI_TEXT_MODEL": "${AI_TEXT_MODEL:-deepseek-v4-flash}", "AI_TEXT_FALLBACK_MODEL": "${AI_TEXT_FALLBACK_MODEL:-deepseek-v4-pro}", "AI_MODEL_ROUTES_JSON": "${AI_MODEL_ROUTES_JSON:-}", "DEEPSEEK_API_KEY": "${DEEPSEEK_API_KEY:-}", "AI_PDF_VISION_ENABLED": "${AI_PDF_VISION_ENABLED:-false}", "AI_VISION_PROVIDER": "${AI_VISION_PROVIDER:-qwen-token-plan-cn}", "AI_VISION_MODEL": "${AI_VISION_MODEL:-qwen3.6-plus}", "QWEN_TOKEN_PLAN_CN_API_KEY": "${QWEN_TOKEN_PLAN_CN_API_KEY:-}"},
      "networks": ["data", "internal"],
      "depends_on": {"redis": {"condition": "service_healthy"}},
      "healthcheck": {"test": ["CMD", "node", "-e", "fetch('http://localhost:3101/internal/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})"], "interval": "10s", "timeout": "5s", "retries": 5},
      "deploy": {"resources": {"limits": {"cpus": "10"}}}
    },
    "web": {
      "build": {"context": "../..", "dockerfile": "infra/docker/web.Dockerfile"},
      "environment": {"NEXT_PUBLIC_API_BASE_URL": "${PUBLIC_API_BASE_URL:-http://localhost:8000}", "APP_COMMIT_SHA": "${COMMIT_SHA:-local}"},
      "ports": ["127.0.0.1:3000:3000"],
      "networks": ["edge"],
      "healthcheck": {"test": ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"], "interval": "10s", "timeout": "5s", "retries": 5}
    },
    "otel-collector": {
      "image": "otel/opentelemetry-collector-contrib:0.139.0",
      "command": ["--config=/etc/otelcol/config.yaml"],
      "volumes": ["../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"],
      "networks": ["internal"],
      "healthcheck": {"test": ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"], "interval": "30s", "timeout": "10s", "retries": 3}
    }
  },
  "networks": {"edge": {}, "internal": {"internal": true}, "data": {"internal": true}},
  "volumes": {"postgres-data": {}, "redis-data": {}}
}
